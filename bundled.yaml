        - active
        - disabled
        - deleted
      description: 通用状态枚举
    PlanTypeEnum:
      type: string
      enum:
        - coding
        - token
        - image
      description: 套餐类型
    QuotaTypeEnum:
      type: string
      enum:
        - token_plan
        - coding_plan
        - image_plan
      description: 配额类型
    ProtocolEnum:
      type: string
      enum:
        - openai
        - anthropic
        - openai_chat
        - openai_responses
        - anthropic_messages
        - tokenmp_gateway
        - custom
      description: 协议类型
    KindEnum:
      type: string
      enum:
        - llm.chat
        - llm.response
        - llm.message
        - image.generate
      description: 端点类型
