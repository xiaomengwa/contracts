      operationId: adminConfigDetail
      tags:
        - config
      summary: 获取系统配置详情
      security:
        - adminBearerAuth: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功
          content:
