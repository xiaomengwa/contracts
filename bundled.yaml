      type: string
      enum:
        - bearer
        - api_key
        - none
      description: 认证类型
    RequestModeEnum:
      type: string
      enum:
        - stream
        - sync
      description: 请求模式
    RoleEnum:
      type: string
      enum:
        - user
        - admin
      description: 用户角色
    BillingPreferenceEnum:
      type: string
      enum:
        - coding
        - token
      description: 计费偏好
