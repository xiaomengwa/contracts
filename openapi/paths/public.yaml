/api/v1/public/plans/list:
  get:
    operationId: publicPlanList
    tags:
      - public
    summary: 获取公开套餐列表
    description: |
      返回所有状态为 active 的公开套餐目录，无需认证。匿名客户端和登录页/注册页应使用本接口；需要用户特定 eligibility、订阅状态或个性化价格时使用 `GET /api/v1/user/plans/list` 并提供 Authorization。
    parameters:
      - name: plan_type
        in: query
        schema:
          $ref: ../schemas/common.yaml#/PlanTypeEnum
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      $ref: ../schemas/envelope.yaml#/PaginatedData
      "400":
        description: 错误
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
