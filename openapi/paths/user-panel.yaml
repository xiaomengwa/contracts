/api/v1/user/me:
  get:
    operationId: userMe
    tags:
      - user
    summary: 获取当前用户信息
    security:
      - bearerAuth: []
    responses:
      "200":
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        user:
                          $ref: ../schemas/user.yaml#/UserResponse
      "400":
        description: 错误
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
