/api/v1/user/quota:
  get:
    operationId: userQuota
    tags:
      - user
    summary: 获取用户配额
    description: |
      返回用户当前可用权益。套餐权益与充值 Token 余额是两个独立权益来源：`plan_tokens` 表示套餐提供的 token 额度，`recharged_tokens` 表示充值或兑换获得的 token 额度，`token_limit` 为两类 token 权益合计上限，`remaining_tokens` 为扣除已用和预留后的当前可用 token。

      当套餐名称为空但 `recharged_tokens` 或 `remaining_tokens` 大于 0 时，前端不应展示为“无可用权益”，应展示充值 Token 余额；请求次数和图片额度同理按各自 remaining 字段判断可用性。
    security:
      - bearerAuth: []
    responses:
      "200":
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      $ref: ../schemas/usage.yaml#/UserQuota
      "400":
        description: 错误
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
/api/v1/user/usage/list:
  get:
    operationId: userUsage
    tags:
      - user
    summary: 获取用户用量账本
    security:
      - bearerAuth: []
    parameters:
      - name: ledger_type
        in: query
        schema:
          type: string
          description: 逗号分隔的账本类型过滤，如 charge,recharge
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - items
                        - page
                        - limit
                        - total
                      properties:
                        items:
                          type: array
                          items:
                            $ref: ../schemas/usage.yaml#/UsageLedgerResponse
                        page:
                          type: integer
                        limit:
                          type: integer
                        total:
                          type: integer
      "400":
        description: 错误
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
/api/v1/user/plans/list:
  get:
    operationId: userPlanList
    tags:
      - user
    summary: 获取用户可用套餐列表
    description: |
      返回登录用户上下文下可购买/可见的套餐列表，必须提供 `Authorization: Bearer <token>`。该接口可在未来包含用户特定资格、价格或订阅状态；未登录客户端应使用 `/api/v1/public/plans/list`。
    security:
      - bearerAuth: []
    parameters:
      - name: plan_type
        in: query
        schema:
          $ref: ../schemas/common.yaml#/PlanTypeEnum
    responses:
      "200":
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - items
                        - page
                        - limit
                        - total
                      properties:
                        items:
                          type: array
                          items:
                            $ref: ../schemas/plan.yaml#/Plan
                        page:
                          type: integer
                        limit:
                          type: integer
                        total:
                          type: integer
      "400":
        description: 错误
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
      "401":
        description: 未授权；用户上下文套餐列表必须登录访问，匿名客户端请使用 /api/v1/public/plans/list
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
