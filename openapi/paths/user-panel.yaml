/api/v1/user/requests/list:
  get:
    operationId: userRequestLogList
    tags:
      - user
    summary: 获取用户请求日志列表
    description: |
      返回用户请求日志分页列表，可作为请求趋势图的数据来源。趋势图应按服务端返回的请求日志时间窗口聚合；当当前趋势窗口没有采样点时返回 `items: []`、`total: 0`，前端可展示空图或 0 采样点，但不应 fallback 到 `dashboard.today_requests` 生成虚假趋势点。

      `total` 表示应用 `query` 过滤后的总数（分页前总数）。
    security:
      - bearerAuth: []
    parameters:
      - name: query
        in: query
        schema:
          type: string
          description: 搜索 trace_id / request_id / request_log_id
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - items
                        - page
                        - limit
                        - total
                      properties:
                        items:
                          type: array
                          items:
                            $ref: ../schemas/requestlog.yaml#/RequestLogResponse
                        page:
                          type: integer
                        limit:
                          type: integer
                        total:
                          type: integer
      "400":
        description: 错误
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
