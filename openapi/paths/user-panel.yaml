/api/v1/user/requests:
  get:
    operationId: userRequestLogList
    tags:
      - user
    summary: 获取用户请求日志列表
    security:
      - bearerAuth: []
    parameters:
      - name: query
        in: query
        schema:
          type: string
          description: "搜索 trace_id / request_id / request_log_id"
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: 成功
