/api/v1/user/me:
  get:
    operationId: userMe
    tags:
      - user
    summary: 获取当前用户信息
    security:
      - bearerAuth: []
    responses:
      "200":
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        user:
                          $ref: ../schemas/user.yaml#/UserResponse
      "400":
        description: 错误
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
/api/v1/user/dashboard:
  get:
    operationId: userDashboard
    tags:
      - user
    summary: 获取用户仪表盘数据
    description: |
      返回用户面板健康统计。`today_*` 字段统计当前业务日窗口（由服务端配置的业务时区决定）的已完成请求/用量；`total_*` 字段统计账号累计用量。

      同屏趋势图不应从本接口伪造采样点；趋势数据应来自 `GET /api/v1/user/requests/list` 或后续专用趋势接口。若趋势窗口为空但 `today_requests > 0`，健康卡片仍展示 dashboard 统计，趋势图展示空态或 0 采样点。
    security:
      - bearerAuth: []
    responses:
      "200":
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      $ref: ../schemas/user.yaml#/UserDashboard
      "400":
        description: 错误
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
