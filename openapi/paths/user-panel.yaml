/api/v1/user/usage/list:
  get:
    operationId: userUsage
    tags:
      - user
    summary: 获取用户用量账本
    security:
      - bearerAuth: []
    parameters:
      - name: ledger_type
        in: query
        schema:
          type: string
          description: 逗号分隔的账本类型过滤，如 charge,recharge
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - items
                        - page
                        - limit
                        - total
                      properties:
                        items:
                          type: array
                          items:
                            $ref: ../schemas/usage.yaml#/UsageLedgerResponse
                        page:
                          type: integer
                        limit:
                          type: integer
                        total:
                          type: integer
      "400":
        description: 错误
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
