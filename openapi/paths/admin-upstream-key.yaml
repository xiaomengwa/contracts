/api/v1/admin/keys/upstream/list:
  get:
    operationId: adminUpstreamKeyList
    tags:
      - admin
    summary: 获取上游密钥列表
    description: |
      返回上游密钥分页列表。客户端搜索/筛选时应重新请求本接口并携带当前 `query`、过滤条件、`page`、`limit`；契约不限定 UI 触发方式（实时输入、回车或点击筛选均可），但列表展示和分页必须以服务端返回为准。

      `total` 表示应用 `query`、`provider_id`、`status`、`quota_type`、`expiring` 后的总数；无匹配结果时返回 `items: []`、`total: 0`。
    security:
      - adminBearerAuth: []
    parameters:
      - name: query
        in: query
        schema:
          type: string
          description: |
            搜索关键字。服务端至少应匹配 `id`、`name`、`provider_name`、`notes`。空字符串或省略表示不按关键字过滤。
      - name: provider_id
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: ../schemas/common.yaml#/StatusEnum
      - name: quota_type
        in: query
        schema:
          $ref: ../schemas/common.yaml#/QuotaTypeEnum
      - name: expiring
        in: query
        schema:
          type: boolean
          description: 是否即将过期
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - items
                        - page
                        - limit
                        - total
                      properties:
                        items:
                          type: array
                          items:
                            $ref: ../schemas/upstream-key.yaml#/UpstreamKey
                        page:
                          type: integer
                        limit:
                          type: integer
                        total:
                          type: integer
        headers:
          Cache-Control:
            $ref: ../headers.yaml#/CacheNoStore
      "401":
        description: 未授权
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
      "403":
        description: 无权限
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
