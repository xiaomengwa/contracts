                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - items
                        - page
                        - limit
                        - total
                      properties:
                        items:
                          type: array
                          items:
                            $ref: ../schemas/upstream-key.yaml#/UpstreamModelMapping
                        page:
                          type: integer
                        limit:
                          type: integer
                        total:
                          type: integer
      "401":
        description: 未授权
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
      "403":
        description: 无权限
