        description: 模型 ID；不传时不过滤模型。upstream_key_id 和 model_id 都不传时返回全部非 deleted 映射。
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
