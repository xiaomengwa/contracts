# 管理员兑换码管理端点

/api/v1/admin/codes/redeem:
  get:
    operationId: adminRedeemCodeList
    tags:
      - redeem
    summary: 获取兑换码列表
    security:
      - adminBearerAuth: []
    parameters:
      - name: query
        in: query
        schema:
          type: string
          description: "搜索名称 / ID"
      - name: code_type
        in: query
        schema:
          type: string
          description: "兑换码类型过滤"
      - name: status
        in: query
        schema:
          $ref: '../schemas/common.yaml#/StatusEnum'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/envelope.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - items
                        - page
                        - limit
                        - total
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '../schemas/redeem.yaml#/RedeemCode'
                        page:
                          type: integer
                        limit:
                          type: integer
                        total:
                          type: integer
      '401':
        description: 未授权
        content:
          application/json:
            schema:
              $ref: '../schemas/envelope.yaml#/ApiErrorResponse'
      '403':
        description: 无权限
        content:
          application/json:
            schema:
              $ref: '../schemas/envelope.yaml#/ApiErrorResponse'

/api/v1/admin/codes/redeem/create:
  post:
    operationId: adminRedeemCodeCreate
    tags:
      - redeem
    summary: 创建兑换码
    security:
      - adminBearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/redeem.yaml#/CreateRedeemCodeRequest'
    responses:
      '201':
        description: 创建成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/envelope.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/redeem.yaml#/RedeemCodeCreateResponse'
      '400':
        description: 参数无效
        content:
          application/json:
            schema:
              $ref: '../schemas/envelope.yaml#/ApiErrorResponse'
      '401':
        description: 未授权
        content:
          application/json:
            schema:
              $ref: '../schemas/envelope.yaml#/ApiErrorResponse'
      '403':
        description: 无权限
        content:
          application/json:
            schema:
              $ref: '../schemas/envelope.yaml#/ApiErrorResponse'

/api/v1/admin/codes/redeem/toggle:
  post:
    operationId: adminRedeemCodeToggle
    tags:
      - redeem
    summary: 切换兑换码启用/禁用
    security:
      - adminBearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/redeem.yaml#/ToggleRedeemCodeRequest'
    responses:
      '200':
        description: 切换成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/envelope.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/redeem.yaml#/RedeemCode'
      '401':
        description: 未授权
        content:
          application/json:
            schema:
              $ref: '../schemas/envelope.yaml#/ApiErrorResponse'
      '403':
        description: 无权限
        content:
          application/json:
            schema:
              $ref: '../schemas/envelope.yaml#/ApiErrorResponse'
      '404':
        description: 兑换码不存在
        content:
          application/json:
            schema:
              $ref: '../schemas/envelope.yaml#/ApiErrorResponse'

