/api/v1/admin/users/list:
  get:
    operationId: adminUserList
    tags:
      - admin
    summary: 获取用户列表
    security:
      - adminBearerAuth: []
    parameters:
      - name: query
        in: query
        schema:
          type: string
          description: 搜索邮箱 / ID
      - name: role
        in: query
        schema:
          $ref: ../schemas/common.yaml#/RoleEnum
      - name: status
        in: query
        schema:
          $ref: ../schemas/common.yaml#/StatusEnum
      - name: coding_plan_id
        in: query
        schema:
          type: string
      - name: token_plan_id
        in: query
        schema:
          type: string
      - name: image_plan_id
        in: query
        schema:
          type: string
      - name: preferred_billing
        in: query
        schema:
          $ref: ../schemas/common.yaml#/BillingPreferenceEnum
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      "200":
        headers:
          Cache-Control:
            $ref: '#/components/headers/CacheControlNoStore'
          Pragma:
            $ref: '#/components/headers/PragmaNoCache'
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - items
                        - page
                        - limit
                        - total
                      properties:
                        items:
                          type: array
                          items:
                            $ref: ../schemas/user.yaml#/UserResponse
                        page:
                          type: integer
                        limit:
                          type: integer
                        total:
                          type: integer
      "401":
        description: 未授权
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
      "403":
        description: 无权限
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
