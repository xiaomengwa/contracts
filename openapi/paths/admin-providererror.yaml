/api/v1/admin/rules/providererror/list:
  get:
    operationId: adminProviderErrorRuleList
    tags:
    - providererror
    summary: 获取供应商错误规则列表
    security:
    - adminBearerAuth: []
    parameters:
    - name: provider_name
      in: query
      schema:
        type: string
    - name: normalize_to
      in: query
      schema:
        $ref: ../schemas/common.yaml#/ErrorCode
    - name: enabled
      in: query
      schema:
        type: boolean
    - name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    - name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../schemas/envelope.yaml#/ApiResponse
              - type: object
                properties:
                  data:
                    type: object
                    required:
                    - items
                    - page
                    - limit
                    - total
                    properties:
                      items:
                        type: array
                        items:
                          $ref: ../schemas/providererror.yaml#/ProviderErrorRule
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
        headers:
          Cache-Control:
            $ref: ../headers.yaml#/CacheNoStore
      '400':
        description: 参数无效
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
      '401':
        description: 未授权
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
      '403':
        description: 无权限
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
