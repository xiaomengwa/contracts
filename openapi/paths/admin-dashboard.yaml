/api/v1/admin/dashboard:
  get:
    operationId: adminDashboard
    tags:
      - admin
    summary: 获取管理员仪表盘数据
    security:
      - adminBearerAuth: []
    responses:
      "200":
        headers:
          Cache-Control:
            $ref: '#/components/headers/CacheControlNoStore'
          Pragma:
            $ref: '#/components/headers/PragmaNoCache'
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      $ref: ../schemas/sysconfig.yaml#/AdminDashboard
      "400":
        description: 错误
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
