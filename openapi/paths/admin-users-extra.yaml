/api/v1/admin/users/quota:
  get:
    operationId: adminUserQuota
    tags:
      - admin
    summary: 获取用户配额
    security:
      - adminBearerAuth: []
    responses:
      "200":
        headers:
          Cache-Control:
            $ref: '#/components/headers/CacheControlNoStore'
          Pragma:
            $ref: '#/components/headers/PragmaNoCache'
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      $ref: ../schemas/usage.yaml#/UserQuota
      "401":
        description: 未授权
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
      "403":
        description: 无权限
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
