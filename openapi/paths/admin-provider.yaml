# 管理员供应商和端点管理端点

/api/v1/admin/providers:
  get:
    operationId: adminProviderList
    tags:
      - admin
    summary: 获取供应商列表
    security:
      - adminBearerAuth: []
    parameters:
      - name: query
        in: query
        schema:
          type: string
          description: "搜索名称 / ID"
      - name: status
        in: query
        schema:
          $ref: '../schemas/common.yaml#/StatusEnum'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/envelope.yaml#/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      required:
                        - items
                        - page
                        - limit
                        - total
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '../schemas/provider.yaml#/Provider'
                        page:
                          type: integer
                        limit:
                          type: integer
                        total:
                          type: integer
      '401':
        description: 未授权
        content:
          application/json:
            schema:
              $ref: '../schemas/envelope.yaml#/ApiErrorResponse'
      '403':
        description: 无权限
        content:
          application/json:
            schema:
              $ref: '../schemas/envelope.yaml#/ApiErrorResponse'

