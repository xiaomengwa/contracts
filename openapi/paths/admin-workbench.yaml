      - admin
    summary: 获取兑换码工作台
    description: 返回兑换码工作台聚合数据。兑换码列表默认不返回明文 code，可返回脱敏值或 null；列表字段始终返回 PaginatedData envelope，空态以 data.redemption_codes.items.length === 0 判断。
    security:
      - adminBearerAuth: []
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
