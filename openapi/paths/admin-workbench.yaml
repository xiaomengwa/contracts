/api/v1/admin/workbench/users:
  get:
    operationId: adminWorkbenchUsers
    tags:
      - admin
    summary: 获取用户工作台
    description: 返回用户工作台聚合数据。支持按 query 搜索邮箱或用户 ID；列表字段始终返回 PaginatedData envelope，空态以 data.users.items.length === 0 判断。
    security:
      - adminBearerAuth: []
    parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: query
        in: query
        required: false
        description: 搜索关键词，匹配用户邮箱或用户 ID；无结果时返回 users.items 为空数组且保留分页 envelope。
        schema:
          type: string
    responses:
      "200":
        headers:
          Cache-Control:
            $ref: '#/components/headers/CacheControlNoStore'
          Pragma:
            $ref: '#/components/headers/PragmaNoCache'
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      $ref: ../schemas/user.yaml#/UserWorkbenchData
      "401":
        description: 未授权
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
      "403":
        description: 无权限
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
