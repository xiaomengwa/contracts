/api/v1/admin/workbench/routes:
  get:
    operationId: adminWorkbenchRoutes
    tags:
      - admin
    summary: 获取路由工作台
    security:
      - adminBearerAuth: []
    responses:
      "200":
        description: 成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: ../schemas/envelope.yaml#/ApiResponse
                - type: object
                  properties:
                    data:
                      $ref: ../schemas/model.yaml#/RouteWorkbenchData
      "401":
        description: 未授权
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
      "403":
        description: 无权限
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
