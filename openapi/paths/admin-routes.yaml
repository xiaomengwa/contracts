/api/v1/admin/routes/groups/list:
  get:
    operationId: adminRouteGroupList
    tags:
    - catalog
    summary: 获取路由组列表
    security:
    - bearerAuth: []
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              allOf:
              - $ref: ../schemas/envelope.yaml#/ApiResponse
              - type: object
                properties:
                  data:
                    type: object
                    required:
                    - items
                    - page
                    - limit
                    - total
                    properties:
                      items:
                        type: array
                        items:
                          $ref: ../schemas/model.yaml#/RouteGroup
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
        headers:
          Cache-Control:
            $ref: ../headers.yaml#/CacheNoStore
      '401':
        description: 未授权
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
      '403':
        description: 无权限
        content:
          application/json:
            schema:
              $ref: ../schemas/envelope.yaml#/ApiErrorResponse
