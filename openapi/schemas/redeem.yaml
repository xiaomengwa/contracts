RedeemCode:
  type: object
  required:
    - id
    - name
    - token_amount
    - max_redemptions
    - redeemed_count
    - status
    - override_mode
    - created_at
    - updated_at
  properties:
    id:
      type: string
    name:
      type: string
    code_prefix:
      type: string
    code_suffix:
      type: string
    token_amount:
      type: integer
    coding_plan_id:
      type: string
    token_plan_id:
      type: string
    image_plan_id:
      type: string
    rewards:
      $ref: "#/RedeemCodeRewards"
    max_redemptions:
      type: integer
    redeemed_count:
      type: integer
    status:
      $ref: ./common.yaml#/StatusEnum
    starts_at:
      type:
        - string
        - "null"
      description: 生效时间；未限制开始时间时为 null。
    expires_at:
      type:
        - string
        - "null"
      description: 过期时间；永不过期或未设置时为 null。
    override_mode:
      type: string
      enum:
        - replace
        - upgrade_only
    created_by:
      type: string
    created_at:
      $ref: ./common.yaml#/Timestamp
    updated_at:
      $ref: ./common.yaml#/Timestamp
RedeemCodeRewards:
  type: object
  description: 兑换码奖励展示对象；没有奖励时返回空对象。
  properties:
    coding_tier_id:
      type: string
    coding_tier_name:
      type: string
    coding_expires_at:
      type: string
    token_tier_id:
      type: string
    token_tier_name:
      type: string
    image_tier_id:
      type: string
    image_tier_name:
      type: string
    token_recharge:
      type: integer
RedeemCodeCreateResponse:
  allOf:
    - $ref: "#/RedeemCode"
    - type: object
      required:
        - code
      properties:
        code:
          type: string
          description: 明文兑换码（仅创建时返回）
RedeemCodeRedemption:
  type: object
  required:
    - id
    - redeem_code_id
    - user_id
    - token_amount
    - created_at
  properties:
    id:
      type: string
    redeem_code_id:
      type: string
    user_id:
      type: string
    token_amount:
      type: integer
    coding_plan_id:
      type: string
    token_plan_id:
      type: string
    image_plan_id:
      type: string
    coding_user_plan_id:
      type: string
    token_user_plan_id:
      type: string
    image_user_plan_id:
      type: string
    ledger_id:
      type: string
    created_at:
      $ref: ./common.yaml#/Timestamp
RedeemCodeRedemptionResponse:
  type: object
  required:
    - redeem_code_id
    - redeem_code_name
    - token_amount
    - rewards
    - redeemed_at
  properties:
    redeem_code_id:
      type: string
    redeem_code_name:
      type: string
    token_amount:
      type: integer
    rewards:
      $ref: "#/RedeemCodeRewards"
    ledger:
      $ref: ./usage.yaml#/UsageLedgerResponse
    redeemed_at:
      $ref: ./common.yaml#/Timestamp
CreateRedeemCodeRequest:
  type: object
  required:
    - name
    - token_amount
    - max_redemptions
  properties:
    name:
      type: string
    token_amount:
      type: integer
    coding_plan_id:
      type: string
    token_plan_id:
      type: string
    image_plan_id:
      type: string
    max_redemptions:
      type: integer
    override_mode:
      type: string
      enum:
        - replace
        - upgrade_only
    starts_at:
      type:
        - string
        - "null"
      description: 生效时间；未限制开始时间时为 null。
    expires_at:
      type:
        - string
        - "null"
      description: 过期时间；永不过期或未设置时为 null。
ToggleRedeemCodeRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
DeleteRedeemCodeRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
RedeemCodeRequest:
  type: object
  required:
    - code
  properties:
    code:
      type: string
RedeemCodeWorkbenchItem:
  allOf:
    - $ref: "#/RedeemCode"
    - type: object
      properties:
        code:
          type:
            - string
            - "null"
          description: 列表展示用兑换码。默认不返回明文；可返回脱敏值或 null，明文仅在创建响应 RedeemCodeCreateResponse.code 中返回。
        display_status:
          type: string
          enum:
            - active
            - disabled
            - expired
            - exhausted
          description: 前端列表展示状态；当 expires_at 已过期时展示 expired，当 redeemed_count >= max_redemptions 时展示 exhausted，否则使用 status。
        conditions:
          type: array
          description: 展示用领取条件；无条件时返回空数组。
          items:
            type: object
            additionalProperties: true
RedeemCodeWorkbenchData:
  type: object
  description: 兑换码工作台聚合数据；空态判断以 redemption_codes.items.length === 0 为准，total 仅用于分页展示。
  required:
    - redemption_codes
    - coding_plans
    - token_plans
    - image_plans
  properties:
    redemption_codes:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/RedeemCodeWorkbenchItem"
              examples:
                - - id: code_1
                    name: Launch promo
                    code: "LAUN****2026"
                    token_amount: 1000
                    max_redemptions: 100
                    redeemed_count: 10
                    status: active
                    display_status: active
                    override_mode: upgrade_only
                    rewards:
                      token_recharge: 1000
                    conditions: []
                    starts_at: null
                    expires_at: "2026-12-31T23:59:59Z"
                    created_at: "2026-06-12T00:00:00Z"
                    updated_at: "2026-06-12T00:00:00Z"
                - []
    coding_plans:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./plan.yaml#/Plan
    token_plans:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./plan.yaml#/Plan
    image_plans:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./plan.yaml#/Plan
