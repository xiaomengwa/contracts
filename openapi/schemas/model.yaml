ModelBillingModeEnum:
  type: string
  enum:
    - billable
    - free_global
  description: 模型计费模式。billable 表示正常计费，free_global 表示全局免费。
CatalogModel:
  allOf:
    - $ref: ./common.yaml#/CatalogStats
    - type: object
      required:
        - id
        - name
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
        billing_mode:
          allOf:
            - $ref: "#/ModelBillingModeEnum"
          default: billable
          description: 模型计费模式。缺省时按 billable 处理。
        mapping_count:
          type: integer
          minimum: 0
          description: 当前模型关联的活跃 upstream mapping 数量；为 0 时模型即使 status 为 active 也不可调用。
        available:
          type: boolean
          description: 模型当前是否可调用；仅当模型启用且至少存在一个活跃可用 upstream mapping 时为 true。
        status:
          $ref: ./common.yaml#/StatusEnum
        created_at:
          $ref: ./common.yaml#/Timestamp
        updated_at:
          $ref: ./common.yaml#/Timestamp
CreateModelRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
    display_name:
      type: string
    description:
      type: string
    billing_mode:
      allOf:
        - $ref: "#/ModelBillingModeEnum"
      default: billable
      description: 模型计费模式。未传时按 billable 创建。
UpdateModelRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    name:
      type: string
    display_name:
      type: string
    description:
      type: string
    billing_mode:
      $ref: "#/ModelBillingModeEnum"
      description: 模型计费模式。未传时不修改现有值。
DeleteModelRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
ToggleModelRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
BatchCreateModelsRequest:
  type: object
  required:
    - models
  properties:
    models:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: object
        required:
          - name
        properties:
          name:
            type: string
          display_name:
            type: string
          description:
            type: string
BatchCreateModelsResult:
  type: object
  required:
    - name
    - success
  properties:
    name:
      type: string
    success:
      type: boolean
    model:
      $ref: "#/CatalogModel"
    error:
      type: string
      description: 失败原因（如 already_exists、name is required）。
BatchCreateModelsResponse:
  type: object
  required:
    - created
    - failed
    - results
  properties:
    created:
      type: integer
    failed:
      type: integer
    results:
      type: array
      items:
        $ref: "#/BatchCreateModelsResult"
BatchDeleteModelsRequest:
  type: object
  required:
    - ids
  properties:
    ids:
      type: array
      minItems: 1
      maxItems: 100
      items:
        type: string
BatchDeleteModelsResult:
  type: object
  required:
    - id
    - success
  properties:
    id:
      type: string
    success:
      type: boolean
    error:
      type: string
      description: 失败原因（如 not_found、id is required）。
BatchDeleteModelsResponse:
  type: object
  required:
    - deleted
    - failed
    - results
  properties:
    deleted:
      type: integer
    failed:
      type: integer
    results:
      type: array
      items:
        $ref: "#/BatchDeleteModelsResult"
RouteGroup:
  type: object
  required:
    - id
    - name
    - status
    - created_at
    - updated_at
  properties:
    id:
      type: string
    name:
      type: string
      pattern: '^[a-z0-9_-]+$'
      description: Route Group 名称，只允许 lowercase 字母、数字、下划线和连字符；uppercase 或其他非法字符应返回结构化 400 validation error。
    display_name:
      type: string
    description:
      type: string
    is_system:
      type: boolean
    status:
      $ref: ./common.yaml#/StatusEnum
    route_count:
      type: integer
    model_count:
      type: integer
    provider_count:
      type: integer
    created_at:
      $ref: ./common.yaml#/Timestamp
    updated_at:
      $ref: ./common.yaml#/Timestamp
UpstreamRouteGroupMembership:
  type: object
  required:
    - id
    - upstream_model_mapping_id
    - route_group_id
    - route_group_name
    - status
  properties:
    id:
      type: string
    upstream_model_mapping_id:
      type: string
    route_group_id:
      type: string
    route_group_name:
      type: string
    route_group_display_name:
      type: string
    is_system:
      type: boolean
    status:
      $ref: ./common.yaml#/StatusEnum
    created_at:
      $ref: ./common.yaml#/Timestamp
    updated_at:
      $ref: ./common.yaml#/Timestamp
UserModelRoute:
  type: object
  properties:
    model_name:
      type: string
    display_name:
      type: string
    capabilities:
      type: array
      items:
        type: string
    context_window_tokens:
      type: integer
    groups:
      type: array
      items:
        type: object
    trend:
      type: array
      items:
        type: object
CreateRouteGroupRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      pattern: '^[a-z0-9_-]+$'
      description: Route Group 名称，只允许 lowercase 字母、数字、下划线和连字符；uppercase 或其他非法字符应返回结构化 400 validation error。
    display_name:
      type: string
    description:
      type: string
UpdateRouteGroupRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    name:
      type: string
      pattern: '^[a-z0-9_-]+$'
      description: Route Group 名称，只允许 lowercase 字母、数字、下划线和连字符；未传时不修改现有值。
    display_name:
      type: string
    description:
      type: string
DeleteRouteGroupRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
ToggleRouteGroupRequest:
  type: object
  required:
    - id
    - status
  properties:
    id:
      type: string
    status:
      $ref: ./common.yaml#/StatusEnum
AddModelRouteGroupRequest:
  type: object
  required:
    - upstream_model_mapping_id
  properties:
    upstream_model_mapping_id:
      type: string
    route_group_id:
      type: string
    route_group_name:
      type: string
RemoveModelRouteGroupRequest:
  type: object
  required:
    - upstream_model_mapping_id
  properties:
    upstream_model_mapping_id:
      type: string
    route_group_id:
      type: string
    route_group_name:
      type: string
    confirm_remove_default:
      type: boolean
RouteWorkbenchData:
  type: object
  required:
    - providers
    - upstream_keys
    - models
    - route_groups
    - mappings
    - memberships
    - model_routes
  properties:
    providers:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./provider.yaml#/Provider
    upstream_keys:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./upstream-key.yaml#/UpstreamKey
    models:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/CatalogModel"
    route_groups:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/RouteGroup"
    mappings:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./upstream-key.yaml#/UpstreamModelMapping
    memberships:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/UpstreamRouteGroupMembership"
    model_routes:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/UserModelRoute"
