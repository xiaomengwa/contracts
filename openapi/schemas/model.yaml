ModelBillingModeEnum:
  type: string
  enum:
    - billable
    - free_global
  description: 模型计费模式。billable 表示正常计费，free_global 表示全局免费。
CatalogModel:
  allOf:
    - $ref: ./common.yaml#/CatalogStats
    - type: object
      required:
        - id
        - name
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        description:
          type: string
        billing_mode:
          allOf:
            - $ref: "#/ModelBillingModeEnum"
          default: billable
          description: 模型计费模式。缺省时按 billable 处理。
        status:
          $ref: ./common.yaml#/StatusEnum
        created_at:
          $ref: ./common.yaml#/Timestamp
        updated_at:
          $ref: ./common.yaml#/Timestamp
CreateModelRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
    display_name:
      type: string
    description:
      type: string
    billing_mode:
      allOf:
        - $ref: "#/ModelBillingModeEnum"
      default: billable
      description: 模型计费模式。未传时按 billable 创建。
UpdateModelRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    name:
      type: string
    display_name:
      type: string
    description:
      type: string
    billing_mode:
      $ref: "#/ModelBillingModeEnum"
      description: 模型计费模式。未传时不修改现有值。
DeleteModelRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
ToggleModelRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
RouteGroup:
  type: object
  required:
    - id
    - name
    - status
    - created_at
    - updated_at
  properties:
    id:
      type: string
    name:
      type: string
    display_name:
      type: string
    description:
      type: string
    is_system:
      type: boolean
    status:
      $ref: ./common.yaml#/StatusEnum
    route_count:
      type: integer
    model_count:
      type: integer
    provider_count:
      type: integer
    created_at:
      $ref: ./common.yaml#/Timestamp
    updated_at:
      $ref: ./common.yaml#/Timestamp
UpstreamRouteGroupMembership:
  type: object
  required:
    - id
    - upstream_model_mapping_id
    - route_group_id
    - route_group_name
    - status
  properties:
    id:
      type: string
    upstream_model_mapping_id:
      type: string
    route_group_id:
      type: string
    route_group_name:
      type: string
    route_group_display_name:
      type: string
    is_system:
      type: boolean
    status:
      $ref: ./common.yaml#/StatusEnum
    created_at:
      $ref: ./common.yaml#/Timestamp
    updated_at:
      $ref: ./common.yaml#/Timestamp
UserModelRoute:
  type: object
  properties:
    model_name:
      type: string
    display_name:
      type: string
    capabilities:
      type: array
      items:
        type: string
    context_window_tokens:
      type: integer
    groups:
      type: array
      items:
        type: object
    trend:
      type: array
      items:
        type: object
CreateRouteGroupRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
    display_name:
      type: string
    description:
      type: string
UpdateRouteGroupRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    name:
      type: string
    display_name:
      type: string
    description:
      type: string
DeleteRouteGroupRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
ToggleRouteGroupRequest:
  type: object
  required:
    - id
    - status
  properties:
    id:
      type: string
    status:
      $ref: ./common.yaml#/StatusEnum
AddModelRouteGroupRequest:
  type: object
  required:
    - upstream_model_mapping_id
  properties:
    upstream_model_mapping_id:
      type: string
    route_group_id:
      type: string
    route_group_name:
      type: string
RemoveModelRouteGroupRequest:
  type: object
  required:
    - upstream_model_mapping_id
  properties:
    upstream_model_mapping_id:
      type: string
    route_group_id:
      type: string
    route_group_name:
      type: string
    confirm_remove_default:
      type: boolean
RouteWorkbenchData:
  type: object
  required:
    - providers
    - upstream_keys
    - models
    - route_groups
    - mappings
    - memberships
    - model_routes
  properties:
    providers:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./provider.yaml#/Provider
    upstream_keys:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./upstream-key.yaml#/UpstreamKey
    models:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/CatalogModel"
    route_groups:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/RouteGroup"
    mappings:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./upstream-key.yaml#/UpstreamModelMapping
    memberships:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/UpstreamRouteGroupMembership"
    model_routes:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/UserModelRoute"
