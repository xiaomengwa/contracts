Plan:
  type: object
  required:
    - id
    - name
    - plan_type
    - hourly_5h_limit
    - weekly_limit
    - monthly_limit
    - token_limit
    - price
    - status
    - created_at
    - updated_at
  properties:
    id:
      type: string
    name:
      type: string
    plan_type:
      $ref: ./common.yaml#/PlanTypeEnum
    hourly_5h_limit:
      type: integer
    weekly_limit:
      type: integer
    monthly_limit:
      type: integer
    token_limit:
      type: integer
      format: int64
    price:
      type: number
      format: double
    status:
      $ref: ./common.yaml#/StatusEnum
    created_at:
      $ref: ./common.yaml#/Timestamp
    updated_at:
      $ref: ./common.yaml#/Timestamp
UserPlan:
  type: object
  required:
    - id
    - user_id
    - plan_id
    - plan_type
    - status
    - activated_at
    - created_at
  properties:
    id:
      type: string
    user_id:
      type: string
    plan_id:
      type: string
    plan_type:
      $ref: ./common.yaml#/PlanTypeEnum
    status:
      $ref: ./common.yaml#/StatusEnum
    activated_at:
      $ref: ./common.yaml#/Timestamp
    expires_at:
      type: string
    created_at:
      $ref: ./common.yaml#/Timestamp
CreatePlanRequest:
  type: object
  required:
    - name
    - plan_type
    - price
  properties:
    name:
      type: string
    plan_type:
      $ref: ./common.yaml#/PlanTypeEnum
    hourly_5h_limit:
      type: integer
    weekly_limit:
      type: integer
    monthly_limit:
      type: integer
    token_limit:
      type: integer
      format: int64
    price:
      type: number
      format: double
UpdatePlanRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    name:
      type: string
    hourly_5h_limit:
      type: integer
    weekly_limit:
      type: integer
    monthly_limit:
      type: integer
    token_limit:
      type: integer
      format: int64
    price:
      type: number
      format: double
DeletePlanRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
TogglePlanRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
SetCodingPlanRequest:
  type: object
  required:
    - user_id
    - plan_id
  properties:
    user_id:
      type: string
    plan_id:
      type: string
    expires_at:
      type: string
    duration_days:
      type: integer
    permanent:
      type: boolean
SetTokenPlanRequest:
  type: object
  required:
    - user_id
    - plan_id
  properties:
    user_id:
      type: string
    plan_id:
      type: string
    expires_at:
      type: string
    duration_days:
      type: integer
    permanent:
      type: boolean
SetImagePlanRequest:
  type: object
  required:
    - user_id
    - plan_id
  properties:
    user_id:
      type: string
    plan_id:
      type: string
    expires_at:
      type: string
    duration_days:
      type: integer
    permanent:
      type: boolean
RenewUserPlanRequest:
  type: object
  required:
    - user_id
    - user_plan_id
  properties:
    user_id:
      type: string
    user_plan_id:
      type: string
    expires_at:
      type: string
    duration_days:
      type: integer
    permanent:
      type: boolean
CancelUserPlanRequest:
  type: object
  required:
    - user_id
    - user_plan_id
  properties:
    user_id:
      type: string
    user_plan_id:
      type: string
ToggleUserPlanRequest:
  type: object
  required:
    - user_id
    - user_plan_id
    - status
  properties:
    user_id:
      type: string
    user_plan_id:
      type: string
    status:
      $ref: ./common.yaml#/StatusEnum
ResetUserPlanUsageRequest:
  type: object
  required:
    - user_id
    - user_plan_id
  properties:
    user_id:
      type: string
    user_plan_id:
      type: string
    reason:
      type: string
PlanWorkbenchData:
  type: object
  required:
    - coding_plans
    - token_plans
    - image_plans
  properties:
    coding_plans:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/Plan"
    token_plans:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/Plan"
    image_plans:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/Plan"
