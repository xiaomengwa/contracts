# 用量和配额类型

UserQuota:
  type: object
  description: |
    用户当前可用权益。套餐权益与充值 Token 余额是独立权益来源：`plan_tokens` 来自 token 套餐，`recharged_tokens` 来自充值/兑换，`token_limit = plan_tokens + recharged_tokens`（扣除策略由实现层执行），`remaining_tokens` 是当前可用 token 余额。套餐名称为空但 `recharged_tokens` 或 `remaining_tokens` 大于 0 时，前端应展示充值 Token 余额而非“无可用权益”。
  required:
    - user_id
    - token_limit
    - plan_tokens
    - recharged_tokens
    - used_tokens
    - reserved_tokens
    - remaining_tokens
    - request_limit
    - used_requests
    - reserved_requests
    - remaining_requests
    - hourly_5h_limit
    - weekly_limit
    - monthly_limit
    - hourly_5h_used
    - weekly_used
    - monthly_used
    - hourly_5h_reserved
    - weekly_reserved
    - monthly_reserved
    - hourly_5h_remaining
    - weekly_remaining
    - monthly_remaining
    - image_limit
    - image_used
    - image_reserved
    - image_remaining
  properties:
    user_id:
      type: string
    token_limit:
      type: integer
      format: int64
      description: Token 权益总上限，通常为套餐 Token 与充值 Token 的合计。
    plan_tokens:
      type: integer
      format: int64
      description: 当前 token 套餐提供的 Token 额度；无 token 套餐时为 0。
    recharged_tokens:
      type: integer
      format: int64
      description: 充值或兑换获得的 Token 额度；即使没有套餐，只要该值或 remaining_tokens 大于 0 也表示用户仍有可用权益。
    token_plan_name:
      type: string
    token_plan_expires_at:
      type: string
    used_tokens:
      type: integer
    reserved_tokens:
      type: integer
      format: int64
    remaining_tokens:
      type: integer
      format: int64
      description: 当前可用 Token 余额，等于权益余额扣除已使用和预留后的结果；前端展示 Token 可用性时优先使用该字段。
    request_limit:
      type: integer
    used_requests:
      type: integer
    reserved_requests:
      type: integer
    remaining_requests:
      type: integer
    coding_plan_name:
      type: string
    coding_plan_expires_at:
      type: string
    hourly_5h_limit:
      type: integer
    weekly_limit:
      type: integer
    monthly_limit:
      type: integer
    hourly_5h_used:
      type: integer
    weekly_used:
      type: integer
    monthly_used:
      type: integer
    hourly_5h_reserved:
      type: integer
    weekly_reserved:
      type: integer
    monthly_reserved:
      type: integer
    hourly_5h_remaining:
      type: integer
    weekly_remaining:
      type: integer
    monthly_remaining:
      type: integer
    hourly_5h_window_end:
      type: string
    weekly_window_end:
      type: string
    monthly_window_end:
      type: string
    image_plan_name:
      type: string
    image_plan_expires_at:
      type: string
    image_limit:
      type: integer
      format: int64
    image_used:
      type: integer
      format: int64
    image_reserved:
      type: integer
      format: int64
    image_remaining:
      type: integer
      format: int64

UsageLedgerResponse:
  type: object
  required:
    - id
    - ledger_type
    - billing_plan
    - token_delta
    - request_delta
    - created_at
  properties:
    id:
      type: string
    user_id:
      type: string
    request_log_id:
      type: string
    request_id:
      type: string
    trace_id:
      type: string
    request_model:
      type: string
    ledger_type:
      $ref: './common.yaml#/LedgerTypeEnum'
    billing_plan:
      type: string
    token_delta:
      type: integer
    request_delta:
      type: integer
    reason:
      type: string
    created_at:
      $ref: './common.yaml#/Timestamp'

AdminUsageDailyItem:
  type: object
  required:
    - date
    - requests
    - success_requests
    - failed_requests
    - input_tokens
    - output_tokens
    - total_tokens
    - images
  properties:
    date:
      type: string
    requests:
      type: integer
    success_requests:
      type: integer
    failed_requests:
      type: integer
    input_tokens:
      type: integer
    output_tokens:
      type: integer
    total_tokens:
      type: integer
    images:
      type: integer

AdminUsageOverview:
  type: object
  required:
    - total_requests
    - success_requests
    - failed_requests
    - requests_today
    - total_tokens
    - daily
  properties:
    total_requests:
      type: integer
    success_requests:
      type: integer
    failed_requests:
      type: integer
    requests_today:
      type: integer
    success_today:
      type: integer
    failed_today:
      type: integer
    total_tokens:
      type: integer
    total_input_tokens:
      type: integer
    total_output_tokens:
      type: integer
    input_tokens_today:
      type: integer
    output_tokens_today:
      type: integer
    tokens_today:
      type: integer
    charged_tokens:
      type: integer
    charged_tokens_today:
      type: integer
    charged_requests:
      type: integer
    charged_images:
      type: integer
    charged_images_today:
      type: integer
    daily:
      type: array
      items:
        $ref: '#/AdminUsageDailyItem'

# 请求体类型

CreateAdminTokenRechargeRequest:
  type: object
  required:
    - user_id
    - amount
  properties:
    user_id:
      type: string
    amount:
      type: integer
