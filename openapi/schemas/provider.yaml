# 供应商和端点类型

Provider:
  allOf:
    - $ref: './common.yaml#/CatalogStats'
    - type: object
      required:
        - id
        - name
        - base_url
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        base_url:
          type: string
          format: uri
          pattern: '^https?://.+$'
          description: Provider base URL，必须是合法的 http 或 https URL；无效值应返回结构化 400 validation error。
        status:
          $ref: './common.yaml#/StatusEnum'
        created_at:
          $ref: './common.yaml#/Timestamp'
        updated_at:
          $ref: './common.yaml#/Timestamp'

ProviderEndpoint:
  type: object
  required:
    - id
    - provider_id
    - protocol
    - path
    - status
    - created_at
    - updated_at
  properties:
    id:
      type: string
    provider_id:
      type: string
    protocol:
      $ref: './common.yaml#/ProtocolEnum'
    kind:
      $ref: './common.yaml#/KindEnum'
    adapter:
      type: string
    path:
      type: string
    method:
      type: string
    auth_type:
      $ref: './common.yaml#/AuthTypeEnum'
    headers:
      description: 自定义请求头（JSON 对象，可能为字符串或 null）
      type: object
      additionalProperties:
        type: string
      x-go-type: json.RawMessage
    request_mode:
      $ref: './common.yaml#/RequestModeEnum'
    status:
      $ref: './common.yaml#/StatusEnum'
    created_at:
      $ref: './common.yaml#/Timestamp'
    updated_at:
      $ref: './common.yaml#/Timestamp'

# 请求体类型

CreateProviderRequest:
  type: object
  required:
    - name
    - base_url
  properties:
    name:
      type: string
    display_name:
      type: string
    base_url:
      type: string
      format: uri
      pattern: '^https?://.+$'
      description: Provider base URL，必须是合法的 http 或 https URL；无效值应返回结构化 400 validation error。

UpdateProviderRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    name:
      type: string
    display_name:
      type: string
    base_url:
      type: string
      format: uri
      pattern: '^https?://.+$'
      description: Provider base URL，必须是合法的 http 或 https URL；未传时不修改现有值，无效值应返回结构化 400 validation error。

DeleteProviderRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string

ToggleProviderRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string

CreateProviderEndpointRequest:
  type: object
  required:
    - provider_id
    - protocol
    - path
  properties:
    provider_id:
      type: string
    protocol:
      $ref: './common.yaml#/ProtocolEnum'
    kind:
      $ref: './common.yaml#/KindEnum'
    adapter:
      type: string
    path:
      type: string
    method:
      type: string
    auth_type:
      $ref: './common.yaml#/AuthTypeEnum'
    headers:
      type: object
      additionalProperties:
        type: string
    request_mode:
      $ref: './common.yaml#/RequestModeEnum'

UpdateProviderEndpointRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    protocol:
      $ref: './common.yaml#/ProtocolEnum'
    kind:
      $ref: './common.yaml#/KindEnum'
    adapter:
      type: string
    path:
      type: string
    method:
      type: string
    auth_type:
      $ref: './common.yaml#/AuthTypeEnum'
    headers:
      type: object
      additionalProperties:
        type: string
    request_mode:
      $ref: './common.yaml#/RequestModeEnum'

DeleteProviderEndpointRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string

UpstreamProviderModel:
  type: object
  description: |
    从上游供应商 models API 探测到的可用模型。该对象用于后台在指定 `provider_id` 和 `upstream_key_id` 后预览上游模型，不代表已写入本地模型目录。
  required:
    - id
  properties:
    id:
      type: string
      description: 上游模型标识，例如 `gpt-4o-mini`。
    owned_by:
      type: string
      description: 上游返回的模型归属方；上游未提供时可省略。

ToggleProviderEndpointRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
