# 供应商和端点类型

Provider:
  allOf:
    - $ref: './common.yaml#/CatalogStats'
    - type: object
      required:
        - id
        - name
        - base_url
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        display_name:
          type: string
        base_url:
          type: string
        status:
          $ref: './common.yaml#/StatusEnum'
        created_at:
          $ref: './common.yaml#/Timestamp'
        updated_at:
          $ref: './common.yaml#/Timestamp'

ProviderEndpoint:
  type: object
  required:
    - id
    - provider_id
    - protocol
    - path
    - status
    - created_at
    - updated_at
  properties:
    id:
      type: string
    provider_id:
      type: string
    protocol:
      $ref: './common.yaml#/ProtocolEnum'
    kind:
      $ref: './common.yaml#/KindEnum'
    adapter:
      type: string
    path:
      type: string
    method:
      type: string
    auth_type:
      $ref: './common.yaml#/AuthTypeEnum'
    headers:
      description: 自定义请求头（JSON 对象，可能为字符串或 null）
      type: object
      additionalProperties:
        type: string
      x-go-type: json.RawMessage
    request_mode:
      $ref: './common.yaml#/RequestModeEnum'
    status:
      $ref: './common.yaml#/StatusEnum'
    created_at:
      $ref: './common.yaml#/Timestamp'
    updated_at:
      $ref: './common.yaml#/Timestamp'

# 请求体类型

CreateProviderRequest:
  type: object
  required:
    - name
    - base_url
  properties:
    name:
      type: string
    display_name:
      type: string
    base_url:
      type: string

UpdateProviderRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    name:
      type: string
    display_name:
      type: string
    base_url:
      type: string

DeleteProviderRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string

ToggleProviderRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string

CreateProviderEndpointRequest:
  type: object
  required:
    - provider_id
    - protocol
    - path
  properties:
    provider_id:
      type: string
    protocol:
      $ref: './common.yaml#/ProtocolEnum'
    kind:
      $ref: './common.yaml#/KindEnum'
    adapter:
      type: string
    path:
      type: string
    method:
      type: string
    auth_type:
      $ref: './common.yaml#/AuthTypeEnum'
    headers:
      type: object
      additionalProperties:
        type: string
    request_mode:
      $ref: './common.yaml#/RequestModeEnum'

UpdateProviderEndpointRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    protocol:
      $ref: './common.yaml#/ProtocolEnum'
    kind:
      $ref: './common.yaml#/KindEnum'
    adapter:
      type: string
    path:
      type: string
    method:
      type: string
    auth_type:
      $ref: './common.yaml#/AuthTypeEnum'
    headers:
      type: object
      additionalProperties:
        type: string
    request_mode:
      $ref: './common.yaml#/RequestModeEnum'

DeleteProviderEndpointRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string

ToggleProviderEndpointRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
