ErrorCategory:
  type: string
  description: 错误分类，用于展示层优先级排序和报告聚合
  enum:
    - request
    - quota
    - rate_limit
    - upstream_rate_limit
    - upstream_config
    - upstream_request
    - upstream_server
    - capacity
    - canceled
    - internal
  x-enum-descriptions:
    request: 客户端请求错误
    quota: 用户配额或余额不足
    rate_limit: 平台侧限流
    upstream_rate_limit: 上游供应商限流
    upstream_config: 上游通道配置异常（认证/权限/套餐）
    upstream_request: 上游判定请求参数非法
    upstream_server: 上游服务端异常
    capacity: 无可用上游或并发容量
    canceled: 客户端主动取消
    internal: 平台内部错误
ErrorAction:
  type: string
  description: 建议调用方在遇到错误后应采取的下一步操作
  enum:
    - fix_request
    - retry_later
    - add_quota
    - contact_admin
    - server_error
    - canceled
    - rate_limited
    - no_capacity
  x-enum-descriptions:
    fix_request: 修正请求参数后重试
    retry_later: 稍后重试
    add_quota: 充值或兑换资源包
    contact_admin: 联系管理员处理
    server_error: 服务端错误，无需重试
    canceled: 请求已取消
    rate_limited: 被限流，降低请求频率
    no_capacity: 无可用容量，稍后重试
ErrorCodeDetail:
  type: object
  description: 错误码的完整元数据
  required:
    - code
    - public_message
    - admin_message
    - action
    - category
    - retryable
    - rate_limited
    - admin_required
    - quota_related
    - billing_related
  properties:
    code:
      $ref: "#/ErrorCode"
    public_message:
      type: string
      description: 面向终端用户的错误提示（中文），避免暴露内部实现细节
    admin_message:
      type: string
      description: 面向管理员的错误提示，包含更多技术细节便于排查
    action:
      $ref: "#/ErrorAction"
    category:
      $ref: "#/ErrorCategory"
    retryable:
      type: boolean
      description: 是否可重试
    rate_limited:
      type: boolean
      description: 是否为限流触发
    admin_required:
      type: boolean
      description: 是否需要管理员介入
    quota_related:
      type: boolean
      description: 是否与配额相关
    billing_related:
      type: boolean
      description: 是否与计费相关
CatalogStats:
  type: object
  properties:
    request_count:
      type: integer
      description: 请求总数
    attempt_count:
      type: integer
      description: 尝试总数
    success_count:
      type: integer
      description: 成功数
    failed_count:
      type: integer
      description: 失败数
    success_rate:
      type: number
      format: double
      description: 成功率（0-1）
    avg_latency_ms:
      type: integer
      description: 平均延迟（毫秒）
    total_tokens:
      type: integer
      format: int64
      description: 总 token 数
    last_attempt_at:
      type: string
      format: date-time
      description: 最后尝试时间
Timestamp:
  type: string
  format: date-time
  description: ISO 8601 时间戳
MarketingStats:
  type: object
  properties:
    user_count:
      type: integer
    model_count:
      type: integer
    request_count:
      type: integer
    provider_count:
      type: integer
