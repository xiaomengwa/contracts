    - UNAUTHORIZED
    - FORBIDDEN
    - NOT_FOUND
    - CONFLICT
    - RATE_LIMITED
    - QUOTA_EXCEEDED
    - CLIENT_CANCELED
    - SERVICE_RESTARTING
    - MODEL_NOT_FOUND
