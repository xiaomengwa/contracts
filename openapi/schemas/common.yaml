    - UPSTREAM_QUOTA_EXCEEDED
    - UPSTREAM_BILLING_REQUIRED
    - UPSTREAM_PLAN_EXPIRED
    - UPSTREAM_PLAN_MODEL_DENIED
    - UPSTREAM_DUPLICATE_REQUEST
    - UPSTREAM_OVERLOADED
    - UPSTREAM_TIMEOUT
    - UPSTREAM_INTERNAL_ERROR
  x-enum-descriptions:
    INVALID_PARAM: 请求参数不正确，请检查后重试。
    UNAUTHORIZED: 认证失败，请检查凭证后重试。
    FORBIDDEN: 当前账号无权执行该操作。
    NOT_FOUND: 请求的资源不存在或已不可用。
    CONFLICT: 请求与当前数据状态冲突，请刷新后重试。
    RATE_LIMITED: 请求过于频繁，请稍后重试。
    QUOTA_EXCEEDED: 当前套餐或余额不足，请充值或兑换资源包后再试。
    CLIENT_CANCELED: 客户端已取消请求，通常是客户端断开连接、超时或主动中止导致。
    SERVICE_RESTARTING: 服务正在重启，请稍后重试。
    MODEL_NOT_FOUND: 请求模型不存在或暂不可用，请检查模型名称。
    ROUTE_GROUP_NOT_FOUND: 请求的路由组不存在或暂不可用，请检查模型选择器。
    PROVIDER_NOT_FOUND: 请求的供应商选择器不存在或暂不可用，请检查模型选择器。
    MODEL_IMAGE_INPUT_UNSUPPORTED: 当前模型不支持图片输入，请选择支持视觉能力的模型或移除图片输入。
    NO_AVAILABLE_UPSTREAM: 模型服务暂时不可用，请稍后重试。
    NO_LEASE_CAPACITY: 模型服务暂时不可用，请稍后重试。
    UPSTREAM_ERROR: 模型服务暂时不可用，请稍后重试。
    UPSTREAM_HTTP_ERROR: 模型服务暂时不可用，请稍后重试。
    UPSTREAM_STREAM_ERROR: 模型服务暂时不可用，请稍后重试。
    INTERNAL_ERROR: 服务暂时不可用，请稍后重试。
    UNSUPPORTED_STREAM_CONVERSION: 当前请求暂不支持该流式模式。
    REDEEM_CODE_INACTIVE: 兑换码暂不可用，请联系管理员确认状态。
    REDEEM_CODE_EXPIRED: 兑换码已过期，请联系管理员确认是否有新的兑换码。
    REDEEM_CODE_EXHAUSTED: 兑换码已被兑完，无法继续使用。
    REDEEM_CODE_ALREADY_REDEEMED: 你已兑换过该兑换码，不能重复使用。
    REDEEM_CODE_PLAN_DOWNGRADE: 当前 Coding Plan 等级更高，不能兑换低等级套餐。
    UPSTREAM_AUTH_INVALID: 当前请求通道配置异常，请联系管理员处理。
    UPSTREAM_PERMISSION_DENIED: 当前请求通道权限不足，请联系管理员处理。
    UPSTREAM_MODEL_NOT_FOUND: 当前模型暂不可用，请联系管理员。
    UPSTREAM_MODEL_NOT_SUPPORTED: 当前模型暂不可用，请切换模型或联系管理员。
    UPSTREAM_INVALID_REQUEST: 请求参数不符合模型要求，请检查后重试。
    UPSTREAM_IMAGE_FORMAT_INVALID: 图片格式不正确或无法解码，请使用 jpg/jpeg/png/webp/gif 图片，并确认 data URL 或 base64 内容有效。
    UPSTREAM_REASONING_STATE_REQUIRED: 模型需要上一轮思考状态。
    UPSTREAM_CONTEXT_LENGTH_EXCEEDED: 输入内容或最大输出长度超过模型上下文限制，请减少输入内容或降低 max_tokens 后重试。
    UPSTREAM_CONTENT_BLOCKED: 请求内容触发安全限制，请调整后重试。
    UPSTREAM_RATE_LIMITED: 当前请求通道请求过于频繁，请稍后重试。
    UPSTREAM_QUOTA_EXCEEDED: 当前请求通道额度不足，请联系管理员处理。
    UPSTREAM_BILLING_REQUIRED: 当前请求通道计费未开通，请联系管理员处理。
    UPSTREAM_PLAN_EXPIRED: 当前请求通道套餐已过期，请联系管理员处理。
    UPSTREAM_PLAN_MODEL_DENIED: 当前请求通道不支持该模型，请联系管理员处理。
    UPSTREAM_DUPLICATE_REQUEST: 检测到重复请求，请稍后重试。
    UPSTREAM_OVERLOADED: 模型服务暂时繁忙，请稍后重试。
    UPSTREAM_TIMEOUT: 模型服务响应超时，请稍后重试。
    UPSTREAM_INTERNAL_ERROR: 模型服务暂时不可用，请稍后重试。
  x-enum-categories:
