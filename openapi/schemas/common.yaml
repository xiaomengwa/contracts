    - REDEEM_CODE_EXHAUSTED
    - REDEEM_CODE_ALREADY_REDEEMED
    - REDEEM_CODE_PLAN_DOWNGRADE
    - UPSTREAM_AUTH_INVALID
    - UPSTREAM_PERMISSION_DENIED
    - UPSTREAM_MODEL_NOT_FOUND
    - UPSTREAM_MODEL_NOT_SUPPORTED
    - UPSTREAM_INVALID_REQUEST
    - UPSTREAM_IMAGE_FORMAT_INVALID
    - UPSTREAM_REASONING_STATE_REQUIRED
