PriceMultiplierRule:
  type: object
  required:
    - id
    - timezone
    - days_of_week
    - start_time
    - end_time
    - multiplier
    - priority
    - status
    - is_active
    - created_at
    - updated_at
  properties:
    id:
      type: string
    provider_id:
      type: string
    key_id:
      type: string
    upstream_key_id:
      type: string
    model_id:
      type: string
    protocol:
      type: string
    global:
      type: boolean
      description: 创建全局规则时必须显式传 `true`，且不应同时传 provider_id/key_id/upstream_key_id/model_id/protocol 等 scope 字段；省略或为 false 时至少需要一个 scope 字段。
    timezone:
      type: string
      pattern: '^[A-Za-z_]+(?:/[A-Za-z0-9_+.-]+)+$|^UTC$'
      description: IANA timezone 名称，例如 `UTC`、`Asia/Shanghai`。无效 timezone 应返回结构化 400 validation error。
    days_of_week:
      type: array
      items:
        type: integer
        minimum: 1
        maximum: 7
    start_time:
      type: string
    end_time:
      type: string
    multiplier:
      type: number
      format: double
    priority:
      type: integer
    status:
      $ref: ./common.yaml#/StatusEnum
    is_active:
      type: boolean
    created_at:
      $ref: ./common.yaml#/Timestamp
    updated_at:
      $ref: ./common.yaml#/Timestamp
