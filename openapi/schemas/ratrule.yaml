ToggleRateRuleRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
DeleteRateRuleRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
RateRuleWorkbenchData:
  type: object
  required:
    - rules
    - providers
    - upstream_keys
    - models
  properties:
    rules:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/PriceMultiplierRule"
    providers:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./provider.yaml#/Provider
    upstream_keys:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./upstream-key.yaml#/UpstreamKey
    models:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./model.yaml#/CatalogModel
