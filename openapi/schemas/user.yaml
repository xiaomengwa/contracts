UserResponse:
  type: object
  description: 用户响应不包含 password_hash、PasswordHash 或其他密码材料。
  required:
    - id
    - email
    - role
    - status
    - preferred_billing
    - fallback_enabled
    - created_at
    - updated_at
  properties:
    id:
      type: string
    email:
      type: string
      format: email
    role:
      $ref: ./common.yaml#/RoleEnum
    status:
      $ref: ./common.yaml#/StatusEnum
    preferred_billing:
      $ref: ./common.yaml#/BillingPreferenceEnum
    fallback_enabled:
      type: boolean
    coding_tier_id:
      type: string
    token_tier_id:
      type: string
    image_tier_id:
      type: string
    coding_plan_id:
      type: string
    token_plan_id:
      type: string
    image_plan_id:
      type: string
    created_at:
      $ref: ./common.yaml#/Timestamp
    updated_at:
      $ref: ./common.yaml#/Timestamp
UserDashboard:
  type: object
  description: |
    用户面板健康统计。`today_*` 字段统计当前业务日窗口（由服务端配置的业务时区决定）的已完成请求/用量；`total_*` 字段统计账号累计用量。趋势图应使用请求日志或专用趋势接口，不应由本对象伪造采样点。
  required:
    - user
    - api_key_count
    - today_requests
    - total_tokens
  properties:
    user:
      $ref: "#/UserResponse"
    api_key_count:
      type: integer
    today_requests:
      type: integer
    total_tokens:
      type: integer
    today_input_tokens:
      type: integer
    today_output_tokens:
      type: integer
    total_input_tokens:
      type: integer
    total_output_tokens:
      type: integer
    today_images:
      type: integer
    total_images:
      type: integer
APIKeyResponse:
  type: object
  description: API Key 通用脱敏响应；常规读取/更新/切换仅返回脱敏 display_key，不返回明文 key。
  required:
    - id
    - name
    - display_key
    - is_active
    - created_at
    - request_count
  properties:
    id:
      type: string
    name:
      type: string
    display_key:
      type: string
      description: 脱敏显示密钥
    is_active:
      type: boolean
    created_at:
      $ref: ./common.yaml#/Timestamp
    last_used_at:
      type: string
    request_count:
      type: integer
APIKeySecretResponse:
  allOf:
    - $ref: "#/APIKeyResponse"
    - type: object
      description: API Key 创建/重置响应；仅这些一次性明文展示场景允许返回 key，客户端不得持久化明文。
      required:
        - key
      properties:
        key:
          type: string
          description: 明文密钥（仅创建或重置时返回一次）
AuthResponse:
  type: object
  required:
    - user
    - token
    - refresh_token
  properties:
    user:
      $ref: "#/UserResponse"
    token:
      type: string
      description: JWT access token
    refresh_token:
      type: string
      description: JWT refresh token
RegisterRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      minLength: 8
    email_code:
      type: string
      description: 邮箱验证码
LoginRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
    password:
      type: string
RefreshRequest:
  type: object
  required:
    - refresh_token
  properties:
    refresh_token:
      type: string
ChangePasswordRequest:
  type: object
  required:
    - old_password
    - new_password
  properties:
    old_password:
      type: string
    new_password:
      type: string
      minLength: 8
ForgotPasswordSendCodeRequest:
  type: object
  required:
    - email
  properties:
    email:
      type: string
      format: email
ForgotPasswordResetRequest:
  type: object
  required:
    - email
    - code
    - new_password
  properties:
    email:
      type: string
      format: email
    code:
      type: string
    new_password:
      type: string
      minLength: 8
CreateAPIKeyRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
UpdateAPIKeyRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    name:
      type: string
DeleteAPIKeyRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
ToggleAPIKeyRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
UpdateBillingPreferenceRequest:
  type: object
  required:
    - preferred_billing
  properties:
    preferred_billing:
      $ref: ./common.yaml#/BillingPreferenceEnum
CaptchaConfig:
  type: object
  properties:
    enabled:
      type: boolean
    scene:
      type: string
    captcha_type:
      type: string
ResetAPIKeyRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
BotKeyResponse:
  type: object
  description: Bot Key 通用脱敏响应；常规读取/更新/切换仅返回脱敏 display_key，不返回明文 key。
  required:
    - id
    - name
    - display_key
    - status
    - created_at
  properties:
    id:
      type: string
    name:
      type: string
    display_key:
      type: string
    status:
      $ref: ./common.yaml#/StatusEnum
    created_at:
      $ref: ./common.yaml#/Timestamp
    last_used_at:
      type: string
BotKeySecretResponse:
  allOf:
    - $ref: "#/BotKeyResponse"
    - type: object
      description: Bot Key 创建响应；仅一次性明文展示场景允许返回 key，客户端不得持久化明文。
      required:
        - key
      properties:
        key:
          type: string
          description: 明文 Bot Key（仅创建时返回一次）
CreateBotKeyRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
ToggleBotKeyRequest:
  type: object
  required:
    - id
    - status
  properties:
    id:
      type: string
    status:
      $ref: ./common.yaml#/StatusEnum
DeleteBotKeyRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
UserAutoModelConfig:
  type: object
  properties:
    enabled:
      type: boolean
    preferred_model:
      type: string
    fallback_enabled:
      type: boolean
UpdateUserAutoModelConfigRequest:
  type: object
  properties:
    enabled:
      type: boolean
    preferred_model:
      type: string
    fallback_enabled:
      type: boolean
BillingConfig:
  type: object
  properties:
    preferred_billing:
      $ref: ./common.yaml#/BillingPreferenceEnum
    fallback_enabled:
      type: boolean
AdminResetUserPasswordRequest:
  type: object
  required:
    - user_id
    - new_password
  properties:
    user_id:
      type: string
    new_password:
      type: string
      minLength: 8
ResetUserClientCancelRiskRequest:
  type: object
  required:
    - user_id
  properties:
    user_id:
      type: string
    reason:
      type: string
UserRiskResetResponse:
  type: object
  properties:
    user_id:
      type: string
    reset_at:
      type: string
    reason:
      type: string
UserWorkbenchQuota:
  type: object
  description: 用户工作台展示用额度快照；后端无法计算时可返回空对象，不能省略 users 分页 envelope。
  properties:
    token_remaining:
      type: integer
      format: int64
      description: 剩余 token 额度；未知时可省略。
    token_total:
      type: integer
      format: int64
      description: token 总额度；未知时可省略。
    coding_remaining:
      type: integer
      description: 剩余 coding 额度；未知时可省略。
    image_remaining:
      type: integer
      description: 剩余 image 额度；未知时可省略。
UserWorkbenchItem:
  allOf:
    - $ref: "#/UserResponse"
    - type: object
      properties:
        display_name:
          type:
            - string
            - "null"
          description: 用户展示名；为空时前端回退到 email 或 id。
        is_admin:
          type: boolean
          description: role 的布尔派生字段；与 role 冲突时以 role 为准，role=admin 等价于 is_admin=true。
        request_plan:
          anyOf:
            - $ref: ./plan.yaml#/UserPlan
            - type: "null"
          description: 当前请求/编码类套餐；无套餐时返回 null。
        token_plan:
          anyOf:
            - $ref: ./plan.yaml#/UserPlan
            - type: "null"
          description: 当前 token 套餐；无套餐时返回 null。
        image_plan:
          anyOf:
            - $ref: ./plan.yaml#/UserPlan
            - type: "null"
          description: 当前图片套餐；无套餐时返回 null。
        quota:
          $ref: "#/UserWorkbenchQuota"
UserWorkbenchData:
  type: object
  description: 用户工作台聚合数据；空态判断以 users.items.length === 0 为准，total 仅用于分页展示。
  required:
    - users
    - coding_plans
    - token_plans
    - image_plans
  properties:
    users:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/UserWorkbenchItem"
              examples:
                - - id: user_1
                    email: admin@example.com
                    role: admin
                    status: active
                    preferred_billing: token
                    fallback_enabled: true
                    display_name: 管理员
                    is_admin: true
                    request_plan: null
                    token_plan: null
                    quota:
                      token_remaining: 100000
                      token_total: 200000
                    created_at: "2026-06-12T00:00:00Z"
                    updated_at: "2026-06-12T00:00:00Z"
                - []
    coding_plans:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./plan.yaml#/Plan
    token_plans:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./plan.yaml#/Plan
    image_plans:
      allOf:
        - $ref: ./envelope.yaml#/PaginatedData
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: ./plan.yaml#/Plan
