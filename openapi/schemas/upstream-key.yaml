# 上游密钥和模型映射类型

UpstreamKey:
  allOf:
    - $ref: './common.yaml#/CatalogStats'
    - type: object
      required:
        - id
        - provider_id
        - name
        - encryption_version
        - max_concurrency
        - priority
        - quota_used
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        provider_id:
          type: string
        name:
          type: string
        key_prefix:
          type: string
        key_suffix:
          type: string
        encryption_version:
          type: integer
        max_concurrency:
          type: integer
        priority:
          type: integer
        quota_type:
          $ref: './common.yaml#/QuotaTypeEnum'
        quota_total:
          type: integer
          format: int64
        quota_used:
          type: integer
          format: int64
        cost:
          type: number
          format: double
        expires_at:
          type: string
        notes:
          type: string
        status:
          $ref: './common.yaml#/StatusEnum'
        created_at:
          $ref: './common.yaml#/Timestamp'
        updated_at:
          $ref: './common.yaml#/Timestamp'

UpstreamModelMapping:
  type: object
  required:
    - id
    - upstream_key_id
    - model_id
    - status
    - created_at
    - updated_at
  properties:
    id:
      type: string
    upstream_key_id:
      type: string
    model_id:
      type: string
    model_name:
      type: string
      description: 平台模型名称，用于管理端列表展示和搜索。
    model_display_name:
      type: string
      description: 平台模型展示名称；前端可优先展示该字段，缺省时回退到 model_name 或 model_id。
    upstream_key_name:
      type: string
      description: 上游 Key 名称，用于管理端列表展示。
    provider_id:
      type: string
      description: 供应商 ID，用于筛选和排障。
    provider_name:
      type: string
      description: 供应商名称，用于管理端列表展示。
    route_groups:
      type: array
      description: 当前映射所属的活跃路由组，用于管理端列表稳定展示分组信息。
      items:
        $ref: './model.yaml#/UpstreamRouteGroupMembership'
    provider_endpoint_id:
      type: string
    provider_protocol_id:
      type: string
    upstream_model_name:
      type: string
    input_price_per_token:
      type: number
      format: double
    output_price_per_token:
      type: number
      format: double
    max_tokens:
      type: integer
    status:
      $ref: './common.yaml#/StatusEnum'
    created_at:
      $ref: './common.yaml#/Timestamp'
    updated_at:
      $ref: './common.yaml#/Timestamp'

UpstreamKeyUsage:
  type: object
  required:
    - upstream_key_id
    - attempt_count
    - success_count
    - failed_count
    - avg_latency_ms
  properties:
    upstream_key_id:
      type: string
    attempt_count:
      type: integer
    success_count:
      type: integer
    failed_count:
      type: integer
    avg_latency_ms:
      type: integer
    last_attempt_at:
      $ref: './common.yaml#/Timestamp'

# 请求体类型

CreateUpstreamKeyRequest:
  type: object
  required:
    - provider_id
    - name
    - key
    - max_concurrency
  properties:
    provider_id:
      type: string
    name:
      type: string
    key:
      type: string
      description: 上游密钥明文（仅创建时提交）
    max_concurrency:
      type: integer
    priority:
      type: integer
    quota_type:
      $ref: './common.yaml#/QuotaTypeEnum'
    quota_total:
      type: integer
      format: int64
    cost:
      type: number
      format: double
    expires_at:
      type: string
    notes:
      type: string

UpdateUpstreamKeyRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    name:
      type: string
    key:
      type: string
      description: 更新密钥明文
    max_concurrency:
      type: integer
    priority:
      type: integer
    quota_type:
      $ref: './common.yaml#/QuotaTypeEnum'
    quota_total:
      type: integer
      format: int64
    cost:
      type: number
      format: double
    expires_at:
      type: string
    notes:
      type: string

DeleteUpstreamKeyRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string

ToggleUpstreamKeyRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string

CreateUpstreamModelMappingRequest:
  type: object
  required:
    - upstream_key_id
    - model_id
  properties:
    upstream_key_id:
      type: string
    model_id:
      type: string
    provider_endpoint_id:
      type: string
    upstream_model_name:
      type: string
    input_price_per_token:
      type: number
      format: double
    output_price_per_token:
      type: number
      format: double
    max_tokens:
      type: integer

BatchCreateUpstreamModelMappingsRequest:
  type: object
  required:
    - model_id
    - upstream_key_ids
  properties:
    model_id:
      type: string
      description: 平台模型 ID，必须引用已有 CatalogModel；不要用模型名作为主身份。
    upstream_key_ids:
      type: array
      minItems: 1
      maxItems: 500
      items:
        type: string
      description: 要批量绑定的上游 Key ID 列表。
    provider_endpoint_id:
      type: string
      description: 可选；用于指定 provider endpoint/protocol。兼容现有单条创建接口字段。
    upstream_model_name:
      type: string
      description: 上游真实模型 ID；为空时由后端按现有单条创建逻辑决定是否默认使用平台模型名。
    input_price_per_token:
      type: number
      format: double
    output_price_per_token:
      type: number
      format: double
    max_tokens:
      type: integer
    route_group_ids:
      type: array
      items:
        type: string
      description: 创建成功后要加入的路由组 ID。建议 Web 默认传 default 组 ID。
    conflict_strategy:
      type: string
      enum:
        - skip
        - fail
      default: skip
      description: 遇到已存在映射时跳过还是让整批失败。

BatchCreateUpstreamModelMappingResult:
  type: object
  required:
    - upstream_key_id
    - status
  properties:
    upstream_key_id:
      type: string
    status:
      type: string
      enum:
        - created
        - skipped
        - failed
    mapping_id:
      type: string
      description: 已存在或已创建的 mapping ID；失败时可为空。
    error_code:
      type: string
    message:
      type: string

BatchCreateUpstreamModelMappingsResponse:
  type: object
  required:
    - created
    - skipped
    - failed
    - total
  properties:
    total:
      type: integer
    created:
      type: array
      items:
        $ref: "#/UpstreamModelMapping"
    skipped:
      type: array
      items:
        $ref: "#/BatchCreateUpstreamModelMappingResult"
    failed:
      type: array
      items:
        $ref: "#/BatchCreateUpstreamModelMappingResult"

UpdateUpstreamModelMappingRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
    upstream_model_name:
      type: string
    input_price_per_token:
      type: number
      format: double
    output_price_per_token:
      type: number
      format: double
    max_tokens:
      type: integer

DeleteUpstreamModelMappingRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string

ToggleUpstreamModelMappingRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: string
